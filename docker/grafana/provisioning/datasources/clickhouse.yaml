apiVersion: 1

datasources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    jsonData:
      port: 8123
      server: clickhouse
      username: ch_user
      tlsSkipVerify: true
      defaultDatabase: default
    secureJsonData:
      password: ch_password
    editable: true
