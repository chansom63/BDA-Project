version: '3.8'

services:
  # ============================================================================
  # 1. REST API BACKEND (OpenSky Feed + ADS-B Simulator Engine)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bda-backend
    networks:
      - flight-pipeline-net
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      KAFKA_BROKERS: flight-kafka:29092
      KAFKA_TOPIC: flight-events
    restart: unless-stopped

  # ============================================================================
  # 2. REACT WEB UI (Interactive Flight Radar Map, Drawer, Alerts)
  # ============================================================================
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: bda-frontend
    networks:
      - flight-pipeline-net
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: unless-stopped

# ==============================================================================
# ATTACH TO PIPELINE NETWORK (Started by start_all.sh)
# ==============================================================================
networks:
  flight-pipeline-net:
    name: bda-project_flight-pipeline-net
    external: true
